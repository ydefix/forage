# mission-control:managed version=2.0.0 digest=sha256:e6879ddabfd33b89a5d92e484d16c643e99211ffd37cce959c070358b407d889
name: Task
description: A bounded deliverable linked to a project outcome.
title: "[Task] "
labels: ["kind:task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What must be observably true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Exact included and excluded work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Checks, artifacts, or observations required before completion.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link issues or write "None".
    validations:
      required: true
