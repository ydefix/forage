[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forage-agent"
version = "0.2.0"
description = "A local search agent that finds the evidence, not the answer — stateful seven-tool retrieval harness for locally-served LLMs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Ydefix / Init & Co." }]
keywords = ["search-agent", "retrieval", "rag", "llm", "mlx", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]

[project.urls]
Homepage = "https://forage-liart.vercel.app"
Repository = "https://github.com/ydefix/forage"
Design = "https://github.com/ydefix/forage/blob/main/DESIGN.md"

[tool.hatch.build.targets.wheel]
packages = ["forage"]
